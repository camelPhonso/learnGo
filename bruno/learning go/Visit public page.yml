info:
  name: Visit public page
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/public/"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Should return 200 ok status", () => {
          expect(res.getStatus()).to.equal(200);
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
